server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /admin/ {
    proxy_pass http://gateway:8080/admin/;
  }

  location /v1/ {
    proxy_pass http://gateway:8080/v1/;
  }

  location /healthz {
    proxy_pass http://gateway:8080/healthz;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

